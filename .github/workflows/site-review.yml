name: Website review checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository checks
        run: npm run check
      - name: Install review browser
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render and test local review build
        run: node scripts/browser-review.mjs
      - name: Keep screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-review
          path: review-results/
          retention-days: 7
